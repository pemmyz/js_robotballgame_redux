<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JS Robot Ball Game Redux: Autobot Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.31/dist/planck.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="darkModeToggle">☀️ Light Mode</button>

    <!-- MAIN MENU OVERLAY -->
    <div id="mainMenu" class="overlay-menu">
        <h1>ROBOT BALL REDUX</h1>
        <p class="subtitle">Physics Soccer Simulator</p>
        
        <div class="menu-buttons">
            <button id="btnStartGame">Start Game (Human vs AI)</button>
            <button id="btnAutobot">Autobot Match (AI vs AI)</button>
            <button id="btnOptions">Options / Tweaks</button>
        </div>

        <div id="autoCountdownBox">
            <p>Autobot Demo starting in <span id="countdownTimer">6</span>...</p>
            <p class="small-hint">(Move mouse to cancel)</p>
        </div>
    </div>

    <!-- OPTIONS MENU OVERLAY -->
    <div id="optionsMenu" class="overlay-menu hidden">
        <h2>Game Options</h2>
        
        <div class="option-group">
            <label>Robot Speed: <span id="valSpeed">14</span></label>
            <input type="range" id="slSpeed" min="5" max="30" value="14">
        </div>

        <div class="option-group">
            <label>Sprint Power: <span id="valSprint">22</span></label>
            <input type="range" id="slSprint" min="15" max="40" value="22">
        </div>

        <div class="option-group">
            <label>Ball Bounciness: <span id="valBounce">0.7</span></label>
            <input type="range" id="slBounce" min="0.1" max="1.5" step="0.1" value="0.7">
        </div>

        <div class="option-group">
            <label>Blue AI Algo:</label>
            <select id="selAiBlue">
                <option value="DEFAULT">Balanced</option>
                <option value="DEFENSIVE">Goalkeeper</option>
                <option value="AGGRESSIVE">Striker</option>
                <option value="CHAOTIC">Chaotic</option>
            </select>
        </div>
        
        <div class="option-group">
            <label>Green AI Algo:</label>
            <select id="selAiGreen">
                <option value="DEFAULT">Balanced</option>
                <option value="DEFENSIVE">Goalkeeper</option>
                <option value="AGGRESSIVE">Striker</option>
                <option value="CHAOTIC">Chaotic</option>
            </select>
        </div>

        <button id="btnCloseOptions" class="back-btn">Back to Menu</button>
    </div>

    <!-- IN-GAME UI -->
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="inGameUI" class="hidden">
            <button id="btnMenuReturn" style="margin-bottom:5px; width:100%;">Return to Menu</button>
            <div id="infoPanel">
                <div class="player-info-container"> 
                    <div class="player-info-column" id="player1Info">
                        <p class="player-name">Blue Bot</p>
                        <div class="sprint-bar-container"><div id="p1SprintBarFill" class="sprint-bar-fill"></div></div>
                        <p id="blueStatusText">AI: Balanced</p>
                    </div>
                    <div class="player-info-column" id="player2Info">
                        <p class="player-name">Green Bot</p>
                        <div class="sprint-bar-container"><div id="p2SprintBarFill" class="sprint-bar-fill"></div></div>
                        <p id="greenStatusText">AI: Balanced</p>
                    </div>
                </div>
                <div class="game-stats-row">
                    <p id="scoreText">Score: 0 - 0</p>
                    <p id="totalTimeText">Time: 0s</p>
                    <p id="pauseHelpText">P: Pause | H: Help | 1/2: Cycle AI In-Game</p>
                </div>
            </div>
            
            <div id="touchControlsContainer">
                <div id="player1TouchControls" class="touch-controls">
                    <p>Player 1 (Blue)</p>
                    <div class="d-pad">
                        <button id="p1TouchUp" class="touch-button d-pad-up">↑</button>
                        <div>
                            <button id="p1TouchLeft" class="touch-button d-pad-left">←</button>
                            <button id="p1TouchDown" class="touch-button d-pad-down">↓</button>
                            <button id="p1TouchRight" class="touch-button d-pad-right">→</button>
                        </div>
                    </div>
                    <button id="p1TouchSprint" class="touch-button action-button">Sprint (N)</button>
                    <button id="p1TouchCatch" class="touch-button action-button">Catch (M)</button>
                </div>
                <!-- P2 Controls omitted for brevity, logic remains in JS -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
